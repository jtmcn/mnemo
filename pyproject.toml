[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemo"
version = "5.0.2"
description = "Personal technical book library with semantic search via MCP"
readme = "README.md"
requires-python = ">=3.13.4,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Joel" }
]
keywords = ["epub", "docx", "pdf", "ebook", "semantic-search", "mcp", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "ebooklib>=0.21",
    "beautifulsoup4>=4.15",
    "lxml>=6.1",
    "tiktoken>=0.14",
    "pydantic>=2.14",
    "httpx>=0.28",
    "tenacity>=9.2",
    "numpy>=2.5",
    "chromadb>=1.5.9",
    "fastmcp>=4.1,<5",
    "mcp>=2.3,<3",
    "isbnlib>=3.10",
    "typer>=0.29",
    "rich>=15.0",
    "python-docx>=1.2",
    "pdfminer-six>=20260107",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "mypy>=2.4",
    "reportlab>=5.1",
]

[project.scripts]
mnemo = "mnemo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::bs4.XMLParsedAsHTMLWarning",
    "error::mcp.shared.exceptions.MCPDeprecationWarning",
]
markers = [
    "integration: marks tests requiring external credentials (deselect with '-m not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
